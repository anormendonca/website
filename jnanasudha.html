<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2028 Aspirant | Secure Focus</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

    <style>
        :root { 
            --bg: #000000; --surface: #09090b; --border: #27272a; 
            --text: #f4f4f5; --muted: #a1a1aa; --accent: #ffffff; --success: #34d399;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Auth Screen */
        #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; }
        #appScreen { display: none; width: 100%; max-width: 1000px; flex-direction: column; gap: 32px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px;}
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info img { border-radius: 50%; width: 40px; height: 40px; border: 1px solid var(--border); }

        .section { background: var(--surface); padding: 32px; border-radius: 12px; border: 1px solid var(--border); }
        h2 { font-size: 1.1rem; font-weight: 500; margin: 0 0 24px 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between;}
        
        .timer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .timer-box { display: flex; flex-direction: column; border-left: 2px solid var(--border); padding-left: 20px; }
        .timer-box span.number { font-size: 2.5rem; font-weight: 600; color: var(--accent); }
        .timer-box span.label { font-size: 0.85rem; color: var(--muted); }

        /* Form Elements Fix */
        input, select, textarea { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; margin-bottom: 12px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        select option { background: var(--surface); color: var(--text); } /* Fixes white dropdown */
        
        button { background: var(--accent); color: var(--bg); font-weight: 500; cursor: pointer; border: none; padding: 10px 20px; border-radius: 8px; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

        /* Tabbed Interface for Marks */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; overflow-x: auto;}
        .tab-btn { background: transparent; color: var(--muted); border: none; padding: 8px 16px; cursor: pointer; font-weight: 500; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); border-radius: 0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-bottom: 20px;}
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 500; }
        .marks-input { width: 80px; padding: 6px; margin: 0; text-align: center; }
        .total-row { font-weight: bold; background: rgba(255,255,255,0.02); }

        /* Grid for Mocks */
        .split-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; align-items: start; }
        .mock-input-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        /* Calendar Overrides */
        .fc { --fc-page-bg-color: transparent; --fc-neutral-bg-color: var(--bg); --fc-border-color: var(--border); --fc-button-bg-color: var(--surface); --fc-button-border-color: var(--border); --fc-button-text-color: var(--text); --fc-today-bg-color: rgba(255,255,255,0.05); --fc-event-bg-color: var(--accent); --fc-event-text-color: var(--bg); }
        .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border); }
        .fc-toolbar-title { font-size: 1rem !important; }
        .fc-timegrid-slot { height: 40px !important; } /* Uncongested slots */
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <h1 style="font-size: 3rem; margin-bottom: 10px;">NEET 2028</h1>
        <p style="color: var(--muted); margin-bottom: 30px;">A personalized tracker for Jnanasudha</p>
        <button id="loginBtn" style="font-size: 1.1rem; padding: 15px 30px;">Sign in with Google</button>
    </div>

    <!-- Main Dashboard -->
    <div id="appScreen">
        <div class="header-bar">
            <div class="user-info">
                <img id="userPfp" src="" alt="Profile">
                <div>
                    <div id="userName" style="font-weight: 500;">User</div>
                    <div style="font-size: 0.8rem; color: var(--success);">● Secure Connection</div>
                </div>
            </div>
            <button class="secondary" id="logoutBtn">Sign Out</button>
        </div>

        <div class="section">
            <div class="timer-grid">
                <div class="timer-box"><span class="number" id="neet">--</span><span class="label">Days to NEET 2028</span></div>
                <div class="timer-box"><span class="number" id="jee">--</span><span class="label">Days to JEE Mains</span></div>
                <div class="timer-box"><span class="number" id="boards">--</span><span class="label">Days to Boards</span></div>
            </div>
        </div>

        <!-- Master Syllabus Marks Card -->
        <div class="section">
            <h2>Master Marks Card</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('bio')">Biology</button>
                <button class="tab-btn" onclick="switchTab('phy')">Physics</button>
                <button class="tab-btn" onclick="switchTab('chem')">Chemistry</button>
                <button class="tab-btn" onclick="switchTab('school')">School/Prep Exams</button>
            </div>
            
            <div id="bio" class="tab-content active"><table id="table-bio"></table></div>
            <div id="phy" class="tab-content"><table id="table-phy"></table></div>
            <div id="chem" class="tab-content"><table id="table-chem"></table></div>
            <div id="school" class="tab-content"><table id="table-school"></table></div>
            
            <div style="display:flex; justify-content:flex-end; margin-top:15px;">
                <button onclick="saveAllMarks()">Save Marks to Cloud</button>
            </div>
        </div>

        <div class="section">
            <h2>Time Blocking</h2>
            <div id="calendar"></div>
        </div>

        <div class="section">
            <h2>Jnanasudha Mock Analytics</h2>
            <div class="split-grid">
                <div>
                    <div class="mock-input-row">
                        <select id="testType">
                            <option value="JUT">JUT (Out of 60)</option>
                            <option value="JPT">JPT (Out of 10)</option>
                            <option value="JFT">JFT (Out of 10)</option>
                        </select>
                        <input type="number" id="testNumber" placeholder="Test No." min="1" max="60">
                        <input type="number" id="testScore" placeholder="Score / 720" max="720">
                    </div>
                    <textarea id="testMistakes" rows="2" placeholder="Identify failure points..."></textarea>
                    <button onclick="saveMockScore()">Log Score</button>
                </div>
                <div><canvas id="scoreChart"></canvas></div>
            </div>
        </div>
    </div>

    <!-- Firebase System -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, query, orderBy, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRehg17cWxXYC9u25lXyZOWVyHuejZ3EE",
            authDomain: "neet-28.firebaseapp.com",
            projectId: "neet-28",
            storageBucket: "neet-28.firebasestorage.app",
            messagingSenderId: "836490296249",
            appId: "1:836490296249:web:32fbb0a51d7e8d08eb9468",
            measurementId: "G-9YRP5GYVR0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let calendarInstance = null;

        // --- AUTHENTICATION ---
        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("Login failed: " + err.message));
        });
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                document.getElementById('userPfp').src = user.photoURL;
                document.getElementById('userName').innerText = user.displayName;
                initApp();
            } else {
                currentUser = null;
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
            }
        });

        // --- MASTER DATA GENERATION ---
        const syllabus = {
            bio: ["The Living World", "Biological Classification", "Plant Kingdom", "Animal Kingdom", "Morphology of Flowering Plants", "Anatomy of Flowering Plants", "Structural Organisation in Animals", "Cell: The Unit of Life", "Biomolecules", "Cell Cycle and Cell Division", "Photosynthesis in Higher Plants", "Respiration in Plants", "Plant Growth and Development", "Breathing and Exchange of Gases", "Body Fluids and Circulation", "Excretory Products", "Locomotion and Movement", "Neural Control", "Chemical Coordination", "Sexual Reproduction in Flowering Plants", "Human Reproduction", "Reproductive Health", "Principles of Inheritance", "Molecular Basis of Inheritance", "Evolution", "Human Health and Disease", "Microbes in Human Welfare", "Biotech: Principles", "Biotech: Applications", "Organisms and Populations", "Ecosystem", "Biodiversity and Conservation"],
            phy: ["Physical World", "Units and Measurements", "Motion in a Straight Line", "Motion in a Plane", "Laws of Motion", "Work, Energy and Power", "Rotational Motion", "Gravitation", "Properties of Solids", "Properties of Fluids", "Thermal Properties", "Thermodynamics", "Kinetic Theory", "Oscillations", "Waves"],
            chem: ["Some Basic Concepts", "Structure of Atom", "Classification of Elements", "Chemical Bonding", "Chemical Thermodynamics", "Equilibrium", "Redox Reactions", "Organic - Basic Principles", "Hydrocarbons", "12th: Solutions", "12th: Electrochemistry", "12th: Chemical Kinetics", "12th: d- and f-Block", "12th: Coordination Compounds", "12th: Haloalkanes", "12th: Alcohols, Phenols", "12th: Aldehydes, Ketones", "12th: Amines", "12th: Biomolecules"],
            school: ["1st PUC: 1st Term", "1st PUC: Midterm", "1st PUC: 2nd Term", "1st PUC: Prep Exam", "2nd PUC: 1st Term", "2nd PUC: Midterm", "2nd PUC: 2nd Term", "2nd PUC: Prep I", "2nd PUC: Prep II", "2nd PUC: Prep III", "2nd PUC: Prep IV", "2nd PUC: Prep V"]
        };

        function generateTables() {
            Object.keys(syllabus).forEach(subject => {
                let html = `<tr><th>Topic / Exam</th><th style="width:100px;">Max Marks</th><th style="width:100px;">Obtained</th></tr>`;
                syllabus[subject].forEach((topic, i) => {
                    const safeId = `${subject}_${i}`;
                    html += `<tr>
                        <td>${topic}</td>
                        <td><input type="number" class="marks-input max-mark" id="max_${safeId}" onchange="calcTotals('${subject}')"></td>
                        <td><input type="number" class="marks-input obt-mark" id="obt_${safeId}" onchange="calcTotals('${subject}')"></td>
                    </tr>`;
                });
                html += `<tr class="total-row"><td>TOTAL</td><td id="total_max_${subject}">0</td><td id="total_obt_${subject}">0</td></tr>`;
                document.getElementById(`table-${subject}`).innerHTML = html;
            });
        }

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        window.calcTotals = function(subject) {
            let totalMax = 0; let totalObt = 0;
            document.querySelectorAll(`#table-${subject} .max-mark`).forEach(el => totalMax += Number(el.value) || 0);
            document.querySelectorAll(`#table-${subject} .obt-mark`).forEach(el => totalObt += Number(el.value) || 0);
            document.getElementById(`total_max_${subject}`).innerText = totalMax;
            document.getElementById(`total_obt_${subject}`).innerText = totalObt;
        }

        window.saveAllMarks = async function() {
            if(!currentUser) return;
            const dataToSave = {};
            document.querySelectorAll('.marks-input').forEach(input => {
                if(input.value) dataToSave[input.id] = input.value;
            });
            await setDoc(doc(db, "users", currentUser.uid, "data", "marks"), dataToSave);
            alert("Marks securely saved to cloud.");
        }

        async function loadMarks() {
            const docSnap = await getDoc(doc(db, "users", currentUser.uid, "data", "marks"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                Object.keys(data).forEach(id => {
                    if(document.getElementById(id)) document.getElementById(id).value = data[id];
                });
                Object.keys(syllabus).forEach(sub => calcTotals(sub));
            }
        }

        // --- APP INITIALIZATION ---
        function initApp() {
            generateTables();
            loadMarks();
            loadMockData();
            initCalendar();
            
            // Countdowns
            const today = new Date().getTime();
            const calcDays = (t) => Math.max(0, Math.ceil((new Date(t).getTime() - today) / 86400000));
            document.getElementById('neet').innerText = calcDays('May 5, 2028');
            document.getElementById('jee').innerText = calcDays('Jan 15, 2028');
            document.getElementById('boards').innerText = calcDays('Mar 1, 2028');
        }

        // --- CALENDAR (User Specific) ---
        function initCalendar() {
            var calendarEl = document.getElementById('calendar');
            if(calendarInstance) calendarInstance.destroy();
            
            calendarInstance = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                headerToolbar: { left: 'prev,next', center: 'title', right: 'timeGridWeek,timeGridDay' },
                slotMinTime: '06:00:00',
                height: 'auto',
                expandRows: true,
                editable: true,
                selectable: true,
                events: async function(info, success, fail) {
                    const q = collection(db, "users", currentUser.uid, "calendar");
                    const snap = await getDocs(q);
                    success(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                },
                select: async function(arg) {
                    var title = prompt('Block Title:');
                    if (title) {
                        const eventId = Date.now().toString();
                        calendarInstance.addEvent({ id: eventId, title, start: arg.start, end: arg.end });
                        await setDoc(doc(db, "users", currentUser.uid, "calendar", eventId), {
                            title, start: arg.startStr, end: arg.endStr
                        });
                    }
                    calendarInstance.unselect();
                },
                eventChange: async function(change) {
                    await setDoc(doc(db, "users", currentUser.uid, "calendar", change.event.id), {
                        title: change.event.title, start: change.event.startStr, end: change.event.endStr
                    }, { merge: true });
                },
                eventClick: async function(arg) {
                    if (confirm(`Delete '${arg.event.title}'?`)) {
                        arg.event.remove();
                        await deleteDoc(doc(db, "users", currentUser.uid, "calendar", arg.event.id));
                    }
                }
            });
            calendarInstance.render();
        }

        // --- JNANASUDHA MOCKS ---
        window.saveMockScore = async function() {
            if(!currentUser) return;
            const type = document.getElementById('testType').value;
            const num = document.getElementById('testNumber').value;
            const score = document.getElementById('testScore').value;
            if(!num || !score) return;

            await setDoc(doc(db, "users", currentUser.uid, "mocks", `${type}-${num}`), {
                type, number: parseInt(num), score: parseInt(score),
                mistakes: document.getElementById('testMistakes').value
            });
            loadMockData();
        };

        let myChart;
        async function loadMockData() {
            const q = query(collection(db, "users", currentUser.uid, "mocks"), orderBy("number"));
            const snap = await getDocs(q);
            let labels = [], scores = [];
            
            snap.forEach((doc) => {
                const data = doc.data();
                labels.push(`${data.type}-${data.number}`);
                scores.push(data.score);
            });

            if(myChart) myChart.destroy();
            Chart.defaults.color = "#a1a1aa";
            myChart = new Chart(document.getElementById('scoreChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{ label: 'Score', data: scores, borderColor: '#ffffff', backgroundColor: 'rgba(255, 255, 255, 0.05)', borderWidth: 2, pointRadius: 4, fill: true }]
                },
                options: { scales: { y: { min: 0, max: 720 } } }
            });
        }
    </script>
</body>
</html>
