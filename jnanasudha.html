<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2028 Aspirant | Focus</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Chart.js and FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

    <style>
        :root { 
            --bg: #000000; 
            --surface: #09090b; 
            --border: #27272a; 
            --text: #f4f4f5; 
            --muted: #a1a1aa; 
            --accent: #ffffff; 
            --success: #34d399;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            line-height: 1.5;
        }

        .container { 
            max-width: 1000px; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 32px; 
        }

        .section { 
            background: var(--surface); 
            padding: 32px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
        }

        h2 { 
            font-size: 1.1rem; 
            font-weight: 500; 
            margin: 0 0 24px 0; 
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .motivation { 
            font-size: 1.25rem; 
            font-weight: 300; 
            color: var(--text); 
            line-height: 1.6;
        }

        .timer-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
        }
        .timer-box { 
            display: flex; 
            flex-direction: column; 
            border-left: 2px solid var(--border);
            padding-left: 20px;
        }
        .timer-box span.number { 
            font-size: 2.5rem; 
            font-weight: 600; 
            color: var(--accent); 
            line-height: 1;
            margin-bottom: 8px;
        }
        .timer-box span.label { 
            font-size: 0.85rem; 
            color: var(--muted); 
            font-weight: 500;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: transparent; 
            color: var(--text); 
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--muted);
        }
        
        button { 
            background: var(--accent); 
            color: var(--bg); 
            font-weight: 500; 
            cursor: pointer; 
            border: none; 
            padding: 12px 24px;
            border-radius: 8px;
            transition: opacity 0.2s; 
            font-size: 0.95rem;
            width: 100%;
        }
        button:hover { opacity: 0.9; }

        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            align-items: start;
        }
        .mock-input-row { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 12px; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 24px; 
            font-size: 0.9rem; 
        }
        th, td { 
            padding: 12px 0; 
            text-align: left; 
            border-bottom: 1px solid var(--border); 
        }
        th { color: var(--muted); font-weight: 500; }
        .score-highlight { font-weight: 600; color: var(--accent); }
        .db-status { font-size: 0.75rem; color: var(--success); text-transform: none; letter-spacing: normal;}

        /* Minimalist Calendar Overrides */
        .fc {
            --fc-page-bg-color: transparent;
            --fc-neutral-bg-color: var(--bg);
            --fc-border-color: var(--border);
            --fc-button-bg-color: var(--surface);
            --fc-button-border-color: var(--border);
            --fc-button-text-color: var(--text);
            --fc-button-hover-bg-color: var(--border);
            --fc-button-active-bg-color: var(--accent);
            --fc-button-active-border-color: var(--accent);
            --fc-today-bg-color: rgba(255, 255, 255, 0.03);
            --fc-event-bg-color: var(--accent);
            --fc-event-border-color: var(--accent);
            --fc-event-text-color: var(--bg);
        }
        .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border); }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 500; color: var(--text); }
        .fc-event { border-radius: 4px; padding: 2px 4px; font-weight: 600; font-size: 0.85rem; border: none; }
        .fc-timegrid-slot-label { color: var(--muted); font-size: 0.8rem; }
        .fc .fc-button-primary:not(:disabled).fc-button-active, .fc .fc-button-primary:not(:disabled):active {
            color: var(--bg);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="section">
            <h2>Daily Grounding <span id="dbIndicator" class="db-status">● Connected to neet-28</span></h2>
            <div id="quoteDisplay" class="motivation">Loading...</div>
        </div>

        <div class="section">
            <h2>The Horizon</h2>
            <div class="timer-grid">
                <div class="timer-box"><span class="number" id="neet">--</span><span class="label">Days to NEET 2028</span></div>
                <div class="timer-box"><span class="number" id="jee">--</span><span class="label">Days to JEE Mains</span></div>
                <div class="timer-box"><span class="number" id="boards">--</span><span class="label">Days to KSEAB Boards</span></div>
            </div>
        </div>

        <!-- NEW: Google Calendar Style Blocks -->
        <div class="section">
            <h2>Time Blocking</h2>
            <p style="color: var(--muted); font-size: 0.85rem; margin-top: -15px; margin-bottom: 20px;">
                Click and drag to create study blocks. Drag to reschedule. Click a block to delete.
            </p>
            <div id="calendar"></div>
        </div>

        <div class="section">
            <h2>Jnanasudha Analytics</h2>
            <div class="split-grid">
                <div>
                    <div class="mock-input-row">
                        <select id="testType">
                            <option value="JUT">JUT</option>
                            <option value="JPT">JPT</option>
                            <option value="JFT">JFT</option>
                        </select>
                        <input type="number" id="testNumber" placeholder="Test No." min="1" max="80">
                        <input type="number" id="testScore" placeholder="Score / 720" max="720">
                    </div>
                    <textarea id="testMistakes" rows="3" placeholder="Identify your failure points..."></textarea>
                    <button onclick="saveMockScore()">Log Performance</button>
                </div>
                
                <div>
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>

            <table>
                <thead>
                    <tr><th>Assessment</th><th>Score</th><th>Failure Point Analysis</th></tr>
                </thead>
                <tbody id="mockTableBody"></tbody>
            </table>
        </div>

    </div>

    <!-- Database Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRehg17cWxXYC9u25lXyZOWVyHuejZ3EE",
            authDomain: "neet-28.firebaseapp.com",
            projectId: "neet-28",
            storageBucket: "neet-28.firebasestorage.app",
            messagingSenderId: "836490296249",
            appId: "1:836490296249:web:32fbb0a51d7e8d08eb9468",
            measurementId: "G-9YRP5GYVR0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- FULLCALENDAR SETUP ---
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek', // Block view by default
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                slotMinTime: '05:00:00', // Starts at 5 AM
                slotMaxTime: '24:00:00', // Ends at Midnight
                height: 650,
                editable: true,
                selectable: true,
                selectMirror: true,
                
                // Fetch events from Firebase
                events: async function(info, successCallback, failureCallback) {
                    try {
                        const q = collection(db, "calendar_events");
                        const snap = await getDocs(q);
                        let events = [];
                        snap.forEach(doc => {
                            events.push({ id: doc.id, ...doc.data() });
                        });
                        successCallback(events);
                    } catch (error) {
                        console.error("Error loading events", error);
                        failureCallback(error);
                    }
                },

                // Create a block
                select: async function(arg) {
                    var title = prompt('Block Title (e.g., Physics JUT Revision):');
                    if (title) {
                        const eventId = Date.now().toString(); // Generate unique ID
                        
                        // Show immediately on UI
                        calendar.addEvent({
                            id: eventId,
                            title: title,
                            start: arg.start,
                            end: arg.end,
                            allDay: arg.allDay
                        });
                        
                        // Save to Firebase
                        await setDoc(doc(db, "calendar_events", eventId), {
                            title: title,
                            start: arg.startStr,
                            end: arg.endStr,
                            allDay: arg.allDay
                        });
                    }
                    calendar.unselect();
                },

                // Move or resize a block
                eventChange: async function(changeInfo) {
                    await setDoc(doc(db, "calendar_events", changeInfo.event.id), {
                        title: changeInfo.event.title,
                        start: changeInfo.event.startStr,
                        end: changeInfo.event.endStr,
                        allDay: changeInfo.event.allDay
                    }, { merge: true });
                },

                // Delete a block
                eventClick: async function(arg) {
                    if (confirm(`Are you sure you want to delete '${arg.event.title}'?`)) {
                        arg.event.remove();
                        await deleteDoc(doc(db, "calendar_events", arg.event.id));
                    }
                }
            });
            calendar.render();
        });


        // --- JNANASUDHA ANALYTICS SETUP ---
        window.saveMockScore = async function() {
            const type = document.getElementById('testType').value;
            const num = document.getElementById('testNumber').value;
            const score = document.getElementById('testScore').value;
            const mistakes = document.getElementById('testMistakes').value;

            if(!num || !score) return alert("Test number and score are required.");

            const testLabel = `${type}-${num}`;
            await setDoc(doc(db, "jnanasudha_mocks", testLabel), {
                type: type,
                number: parseInt(num),
                score: parseInt(score),
                mistakes: mistakes,
                timestamp: new Date()
            });
            
            document.getElementById('testNumber').value = '';
            document.getElementById('testScore').value = '';
            document.getElementById('testMistakes').value = '';
            loadMockData();
        };

        let myChart;
        async function loadMockData() {
            try {
                const q = query(collection(db, "jnanasudha_mocks"), orderBy("number"));
                const querySnapshot = await getDocs(q);
                
                let labels = [];
                let scores = [];
                let tableHTML = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    labels.push(`${data.type}-${data.number}`);
                    scores.push(data.score);
                    
                    tableHTML = `<tr>
                        <td>${data.type}-${data.number}</td>
                        <td class="score-highlight">${data.score}</td>
                        <td>${data.mistakes}</td>
                    </tr>` + tableHTML; 
                });

                document.getElementById('mockTableBody').innerHTML = tableHTML;
                updateChart(labels, scores);
            } catch (error) {
                console.error("Error reading database:", error);
            }
        }

        function updateChart(labels, data) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = "#a1a1aa";

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Score',
                        data: data,
                        borderColor: '#ffffff',
                        backgroundColor: 'rgba(255, 255, 255, 0.05)',
                        borderWidth: 2,
                        pointBackgroundColor: '#000000',
                        pointBorderColor: '#ffffff',
                        pointRadius: 4,
                        tension: 0.2,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: { 
                        y: { min: 0, max: 720, grid: { color: '#27272a' }, border: { display: false } }, 
                        x: { grid: { display: false }, border: { display: false } } 
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        loadMockData();
    </script>

    <!-- Countdowns and Quotes -->
    <script>
        const quotes = [
            '"If God sends you many sufferings, it is a sign that He has great plans for you." – St. Ignatius',
            '"We know that suffering produces perseverance; character; and hope." – Romans 5:3',
            '"The impediment to action advances action. What stands in the way becomes the way." – Marcus Aurelius',
            '"Pray as though everything depended on God. Work as though everything depended on you." – St. Augustine'
        ];
        document.getElementById('quoteDisplay').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        function updateCountdowns() {
            const today = new Date().getTime();
            const neetDate = new Date('May 5, 2028 00:00:00').getTime();
            const jeeDate = new Date('Jan 15, 2028 00:00:00').getTime(); 
            const boardsDate = new Date('Mar 1, 2028 00:00:00').getTime();

            const calcDays = (t) => Math.max(0, Math.ceil((t - today) / (1000 * 60 * 60 * 24)));
            document.getElementById('neet').innerText = calcDays(neetDate);
            document.getElementById('jee').innerText = calcDays(jeeDate);
            document.getElementById('boards').innerText = calcDays(boardsDate);
        }
        updateCountdowns();
    </script>
</body>
</html>
